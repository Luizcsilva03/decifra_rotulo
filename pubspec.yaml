name: decifra_rotulo
description: "Decifra Rótulo - Escaneie produtos e descubra o que você está consumindo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP e Scanner
  http: ^1.2.1
  mobile_scanner: ^5.1.1

  # Animação de Carregamento
  loading_animation_widget: ^1.2.1

  # Banco de Dados Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase Auth
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.11
  google_fonts: ^6.2.1

   # Para escolher imagens da galeria/câmera
  image_picker: ^1.1.2

  # Para salvar as imagens no Firebase
  firebase_storage: ^12.1.0

  # Para salvar pequenas informações no dispositivo
  shared_preferences: ^2.2.3

  # Para ler informações do app, como a versão
  package_info_plus: ^8.0.0 

  # Para criar máscaras em campos de texto
  mask_text_input_formatter: ^2.9.0
  google_mobile_ads: ^6.0.0

  # Pacote principal para o Firebase Messaging
  firebase_messaging: ^15.0.1 

  # Pacote para mostrar notificações locais (quando o app está aberto)
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Geradores de código
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  #Gerador de icones
  flutter_launcher_icons: ^0.13.1

# Configuração do Flutter
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/

# Configuração da Splash Screen
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android: true
  ios: true

# ADICIONE ESTE BLOCO INTEIRO
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"